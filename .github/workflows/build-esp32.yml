name: Build ESP32-C3 Firmware & Web App

on:
  push:
    branches: [ main, master ]
    tags:
      - 'v*'
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-esp32-firmware:
    name: Build ESP32-C3 Firmware (Merged & Separate Bins)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install PlatformIO & esptool
        run: |
          python -m pip install --upgrade pip
          pip install platformio esptool

      - name: Build Firmware with PlatformIO
        run: |
          pio run -d firmware -e esp32-c3-devkitm-1

      - name: Prepare Separate and Merged Binaries
        run: |
          mkdir -p firmware_release/separate_bins
          BUILD_DIR="firmware/.pio/build/esp32-c3-devkitm-1"
          
          # Locate boot_app0.bin from platformio packages
          BOOT_APP0=$(find ~/.platformio/packages -name "boot_app0.bin" | head -n 1)
          if [ -z "$BOOT_APP0" ]; then
            echo "boot_app0.bin not found in ~/.platformio, searching elsewhere..."
            BOOT_APP0=$(find / -name "boot_app0.bin" 2>/dev/null | head -n 1)
          fi

          echo "Found boot_app0 at: $BOOT_APP0"
          
          # Copy separate binaries with explicit flash address prefixes
          cp "$BUILD_DIR/bootloader.bin" firmware_release/separate_bins/0x0000_bootloader.bin
          cp "$BUILD_DIR/partitions.bin" firmware_release/separate_bins/0x8000_partitions.bin
          if [ -n "$BOOT_APP0" ]; then
            cp "$BOOT_APP0" firmware_release/separate_bins/0xe000_boot_app0.bin
          fi
          cp "$BUILD_DIR/firmware.bin" firmware_release/separate_bins/0x10000_esp32c3_cob_pwm.bin

          # Also keep standard un-prefixed names for conventional flashers
          cp "$BUILD_DIR/bootloader.bin" firmware_release/separate_bins/bootloader.bin
          cp "$BUILD_DIR/partitions.bin" firmware_release/separate_bins/partitions.bin
          if [ -n "$BOOT_APP0" ]; then
            cp "$BOOT_APP0" firmware_release/separate_bins/boot_app0.bin
          fi
          cp "$BUILD_DIR/firmware.bin" firmware_release/separate_bins/firmware_ota.bin

          # Merge binaries into a single factory image at 0x0000
          echo "Merging binaries with esptool.py..."
          if [ -n "$BOOT_APP0" ]; then
            python -m esptool --chip esp32c3 merge_bin \
              -o firmware_release/esp32c3_cob_pwm_merged_factory_0x0.bin \
              --flash_mode dio \
              --flash_freq 80m \
              --flash_size 4MB \
              0x0000 "$BUILD_DIR/bootloader.bin" \
              0x8000 "$BUILD_DIR/partitions.bin" \
              0xe000 "$BOOT_APP0" \
              0x10000 "$BUILD_DIR/firmware.bin"
          else
            python -m esptool --chip esp32c3 merge_bin \
              -o firmware_release/esp32c3_cob_pwm_merged_factory_0x0.bin \
              --flash_mode dio \
              --flash_freq 80m \
              --flash_size 4MB \
              0x0000 "$BUILD_DIR/bootloader.bin" \
              0x8000 "$BUILD_DIR/partitions.bin" \
              0x10000 "$BUILD_DIR/firmware.bin"
          fi

          # Generate SHA256 checksums
          cd firmware_release
          sha256sum esp32c3_cob_pwm_merged_factory_0x0.bin separate_bins/* > SHA256SUMS.txt
          cd ..

          # Create a single flash-package zip
          cd firmware_release
          zip -r ../esp32c3_cob_pwm_full_flash_bundle.zip *
          cd ..

      - name: List Generated Binaries
        run: |
          ls -lah firmware_release/
          ls -lah firmware_release/separate_bins/

      - name: Upload Merged Factory Binary
        uses: actions/upload-artifact@v4
        with:
          name: esp32c3-merged-factory-binary-0x0
          path: firmware_release/esp32c3_cob_pwm_merged_factory_0x0.bin

      - name: Upload Separate Binaries
        uses: actions/upload-artifact@v4
        with:
          name: esp32c3-separate-flash-binaries
          path: firmware_release/separate_bins/

      - name: Upload Full Flash Bundle & Checksums
        uses: actions/upload-artifact@v4
        with:
          name: esp32c3-full-flash-bundle
          path: |
            esp32c3_cob_pwm_full_flash_bundle.zip
            firmware_release/SHA256SUMS.txt

      - name: Create GitHub Release (On Tag Push)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            firmware_release/esp32c3_cob_pwm_merged_factory_0x0.bin
            firmware_release/SHA256SUMS.txt
            esp32c3_cob_pwm_full_flash_bundle.zip
            firmware_release/separate_bins/0x0000_bootloader.bin
            firmware_release/separate_bins/0x8000_partitions.bin
            firmware_release/separate_bins/0xe000_boot_app0.bin
            firmware_release/separate_bins/0x10000_esp32c3_cob_pwm.bin
          draft: false
          prerelease: false
          generate_release_notes: true

  build-web-app:
    name: Build & Verify Web Application
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Typecheck / Lint
        run: npm run lint

      - name: Build Web Application
        run: npm run build

      - name: Upload Web Build
        uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: dist/
